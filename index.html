<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #eceef2;
  --surface:  #f4f5f7;
  --surface2: #e8eaef;
  --surface3: #e0e3ea;
  --border:   #d0d4de;
  --border2:  #b8bdd0;
  --text:     #1e2133;
  --text2:    #52596e;
  --text3:    #8b92a8;
  --accent:   #3b5bdb;
  --accent-s: #e0e7ff;

  --c-crit:   #b91c1c; --b-crit: #fde8e8; --br-crit: #f0a0a0;
  --c-high:   #b45309; --b-high: #fef3e2; --br-high: #f0c070;
  --c-med:    #7c6d00; --b-med:  #faf6d0; --br-med:  #d4c050;
  --c-low:    #166534; --b-low:  #e8f5ee; --br-low:  #7ec9a0;
  --c-none:   #52596e; --b-none: #edeef2; --br-none: #b8bdd0;

  --sans: 'Inter', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --r: 6px; --rl: 10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}

/* ── Topbar ── */
.topbar{background:#e2e4eb;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.07);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
.logo{font-weight:700;font-size:15px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logo span{color:var(--accent)}
.topbar-sep{flex:1}
#topbar-artifact{font-size:12px;color:var(--text2);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);letter-spacing:.4px;white-space:nowrap}
.btn{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:var(--r);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
#file-input{display:none}

/* ── Drop zone ── */
#dropzone{margin:56px auto;max-width:520px;border:2px dashed var(--border2);border-radius:var(--rl);padding:60px 32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--surface)}
#dropzone:hover,#dropzone.over{border-color:var(--accent);background:var(--accent-s)}
#dropzone svg{opacity:.35;margin-bottom:16px}
#dropzone h2{font-weight:600;font-size:17px;margin-bottom:6px}
#dropzone p{color:var(--text2);font-size:13px}
#dropzone small{display:block;margin-top:10px;color:var(--text3);font-size:11px}

/* ── Main ── */
#main{display:none;padding:20px 24px 60px}

/* ── Section label ── */
.slabel{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Meta grid ── */
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.meta-cell{background:var(--surface);padding:11px 14px}
.meta-key{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:3px}
.meta-val{font-size:13px;color:var(--text);font-weight:500}
.meta-val.mono{font-family:var(--mono);font-weight:400;font-size:12px}

/* ── Stat cards ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat.s-crit::before{background:var(--c-crit)}
.stat.s-high::before{background:var(--c-high)}
.stat.s-med::before{background:var(--c-med)}
.stat.s-low::before{background:var(--c-low)}
.stat.s-none::before{background:var(--border2)}
.stat.s-total::before{background:var(--accent)}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:4px}
.stat-num{font-size:26px;font-weight:700;line-height:1;color:var(--text)}
.stat.s-crit .stat-num{color:var(--c-crit)}
.stat.s-high .stat-num{color:var(--c-high)}
.stat.s-med .stat-num{color:var(--c-med)}
.stat.s-low .stat-num{color:var(--c-low)}
.stat.s-total .stat-num{color:var(--accent)}

/* ── Target tabs ── */
.target-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.ttab{padding:9px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s;user-select:none;display:flex;align-items:center;gap:7px}
.ttab:hover{color:var(--text)}
.ttab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ttab-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--surface2);color:var(--text3)}
.ttab.active .ttab-badge{background:var(--accent-s);color:var(--accent)}
.tpanel{display:none}
.tpanel.active{display:block}

/* ── Table card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.toolbar{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2)}
.search{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 11px;color:var(--text);font-family:var(--sans);font-size:13px;width:220px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-s)}
.search::placeholder{color:var(--text3)}
.fbtn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:5px 10px;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;user-select:none;letter-spacing:.2px}
.fbtn:hover{border-color:var(--border2);color:var(--text)}
.fbtn.on-crit{background:var(--b-crit);border-color:var(--br-crit);color:var(--c-crit)}
.fbtn.on-high{background:var(--b-high);border-color:var(--br-high);color:var(--c-high)}
.fbtn.on-med{background:var(--b-med);border-color:var(--br-med);color:var(--c-med)}
.fbtn.on-low{background:var(--b-low);border-color:var(--br-low);color:var(--c-low)}
.fbtn.on-none{background:var(--b-none);border-color:var(--br-none);color:var(--c-none)}
select.fbtn{padding:5px 8px;appearance:auto}
.tcount{margin-left:auto;font-size:11px;color:var(--text3)}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--text2)}
thead th.sa::after{content:' ↑';color:var(--accent)}
thead th.sd::after{content:' ↓';color:var(--accent)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td{padding:9px 12px;vertical-align:middle;color:var(--text)}
td.mono{font-family:var(--mono);font-size:12px}
td.muted{color:var(--text2)}

/* expand row */
.xrow{display:none}
.xrow.open{display:table-row}
.xcell{padding:0!important}
.xbody{padding:14px 16px;background:var(--surface2);border-top:1px solid var(--border)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.xfield label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);display:block;margin-bottom:3px}
.xfield p{font-size:13px;color:var(--text);word-break:break-all}
.xfield p.mono{font-family:var(--mono);font-size:11px;color:var(--text2)}
.refs-list{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.refs-list a{font-size:11px;color:var(--accent);text-decoration:none;word-break:break-all}
.refs-list a:hover{text-decoration:underline}
.vendor-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.vscore{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--surface3);border:1px solid var(--border);color:var(--text2)}

/* ── Badges ── */
.sev{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;border:1px solid}
.sev-CRITICAL{background:var(--b-crit);color:var(--c-crit);border-color:var(--br-crit)}
.sev-HIGH{background:var(--b-high);color:var(--c-high);border-color:var(--br-high)}
.sev-MEDIUM{background:var(--b-med);color:var(--c-med);border-color:var(--br-med)}
.sev-LOW{background:var(--b-low);color:var(--c-low);border-color:var(--br-low)}
.sev-UNKNOWN,.sev-NONE{background:var(--b-none);color:var(--c-none);border-color:var(--br-none)}

.status-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface3);color:var(--text2);font-weight:500}
.status-badge.affected{background:#fff0f0;border-color:#f5b8b8;color:#b91c1c}
.status-badge.fixed{background:#edfbf0;border-color:#7ec9a0;color:#166534}
.status-badge.will_not_fix{background:#f5f0e8;border-color:#d4b87a;color:#7a5c00}

.type-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;background:var(--surface3);border:1px solid var(--border2);color:var(--text2)}

.cwe{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;background:var(--accent-s);border:1px solid #b8c8f5;color:var(--accent);margin:1px 2px 1px 0;font-family:var(--mono)}

.score-wrap{display:flex;align-items:center;gap:6px}
.score-val{font-weight:600;font-size:13px;min-width:30px}
.score-bar{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;min-width:48px}
.score-fill{height:100%;border-radius:2px}

.xbtn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;padding:0;transition:color .15s}
.xbtn:hover{color:var(--accent)}

.pkg-wrap{display:flex;flex-direction:column;gap:1px}
.pkg-name{font-weight:500;color:var(--text)}
.pkg-ver{font-size:11px;color:var(--text2);font-family:var(--mono)}

.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}

/* CVSS panel */
.cvss-block{display:flex;flex-direction:column;gap:4px}
.cvss-row{display:flex;align-items:baseline;gap:8px;font-size:12px}
.cvss-src{font-weight:600;color:var(--text2);min-width:36px}
.cvss-vec{font-family:var(--mono);font-size:10px;color:var(--text3);word-break:break-all}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Responsive ── */
@media(max-width:700px){
  #main{padding:12px}
  .search{width:150px}
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    Trivy<span>scan</span>
  </div>
  <span class="pill" id="schema-pill">Schema v2</span>
  <div class="topbar-sep"></div>
  <span id="topbar-artifact"></span>
  <button class="btn" onclick="document.getElementById('file-input').click()">Load JSON</button>
  <input type="file" id="file-input" accept=".json">
</div>

<!-- Drop zone -->
<div id="dropzone">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="6" width="36" height="36" rx="4" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M24 16v16M16 24l8-8 8 8" stroke="#3b5bdb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h2>Drop Trivy JSON report here</h2>
  <p>SchemaVersion 2 · or click to browse</p>
  <small>All processing happens in your browser — no data leaves your machine</small>
</div>

<!-- Dashboard -->
<div id="main">

  <!-- Metadata -->
  <div class="slabel">scan info</div>
  <div class="meta-grid" id="meta-grid"></div>

  <!-- Stats -->
  <div class="slabel">vulnerability summary</div>
  <div class="stats" id="stats"></div>

  <!-- Target tabs + tables -->
  <div class="slabel">results by target</div>
  <div class="target-bar" id="target-bar"></div>
  <div id="panels"></div>

</div>

<script>
// ── State ─────────────────────────────────────────────────────
let DATA = null;
let sortState = {};   // { panelId: { key, dir } }
let sevFilters = {};  // { panelId: Set }

// ── File load ─────────────────────────────────────────────────
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');

dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
fi.addEventListener('change', e => { if(e.target.files[0]) load(e.target.files[0]); e.target.value=''; });

function load(file) {
  const r = new FileReader();
  r.onload = e => {
    try { DATA = JSON.parse(e.target.result); init(); }
    catch(err) { alert('Invalid JSON:\n' + err.message); }
  };
  r.readAsText(file);
}

// ── Init ──────────────────────────────────────────────────────
function init() {
  dz.style.display = 'none';
  document.getElementById('main').style.display = 'block';
  renderMeta();
  renderStats();
  renderTargets();
}

// ── Metadata ─────────────────────────────────────────────────
function renderMeta() {
  const d = DATA;
  const os = d.Metadata?.OS;
  const ts = d.CreatedAt ? new Date(d.CreatedAt).toLocaleString() : '—';
  const allVulns = getAllVulns();

  document.getElementById('topbar-artifact').textContent = d.ArtifactName || '';
  document.getElementById('schema-pill').textContent = 'Schema v' + (d.SchemaVersion || '?');

  const fields = [
    ['Artifact', d.ArtifactName || '—', false],
    ['Type', d.ArtifactType || '—', false],
    ['Scanned at', ts, false],
    ['OS', os ? `${os.Family} ${os.Name}` : '—', false],
    ['Targets', (d.Results || []).length + ' result(s)', false],
    ['Total vulns', allVulns.length + ' found', false],
  ];

  document.getElementById('meta-grid').innerHTML = fields.map(([k,v,mono]) =>
    `<div class="meta-cell"><div class="meta-key">${k}</div><div class="meta-val${mono?' mono':''}">${esc(v)}</div></div>`
  ).join('');
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats() {
  const vulns = getAllVulns();
  const cnt = {CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0,UNKNOWN:0};
  vulns.forEach(v => { const s = v.Severity || 'UNKNOWN'; cnt[s] = (cnt[s]||0)+1; });

  const cards = [
    {label:'Total', num: vulns.length, cls:'s-total'},
    {label:'Critical', num: cnt.CRITICAL, cls:'s-crit'},
    {label:'High', num: cnt.HIGH, cls:'s-high'},
    {label:'Medium', num: cnt.MEDIUM, cls:'s-med'},
    {label:'Low', num: cnt.LOW, cls:'s-low'},
    {label:'Unknown', num: cnt.UNKNOWN||0, cls:'s-none'},
  ];

  document.getElementById('stats').innerHTML = cards.map(c =>
    `<div class="stat ${c.cls}"><div class="stat-label">${c.label}</div><div class="stat-num">${c.num}</div></div>`
  ).join('');
}

// ── Targets ───────────────────────────────────────────────────
function renderTargets() {
  const results = DATA.Results || [];
  const bar = document.getElementById('target-bar');
  const panels = document.getElementById('panels');
  bar.innerHTML = '';
  panels.innerHTML = '';

  results.forEach((res, i) => {
    const pid = 'p' + i;
    sortState[pid] = { key: 'Severity', dir: 1 };
    sevFilters[pid] = new Set();

    const vulns = res.Vulnerabilities || [];
    const cnt = countSev(vulns);
    const active = i === 0 ? ' active' : '';

    // tab
    const tab = document.createElement('div');
    tab.className = 'ttab' + active;
    tab.dataset.pid = pid;
    tab.innerHTML = `
      <span>${esc(shortTarget(res.Target || '—'))}</span>
      <span class="type-badge">${esc(res.Type || res.Class || '—')}</span>
      <span class="ttab-badge">${vulns.length}</span>`;
    tab.title = res.Target || '';
    tab.addEventListener('click', () => switchTab(pid));
    bar.appendChild(tab);

    // panel
    const panel = document.createElement('div');
    panel.className = 'tpanel' + active;
    panel.id = pid;
    panel.innerHTML = buildPanel(res, pid);
    panels.appendChild(panel);

    // wire events after DOM insert
    wirePanel(res, pid);
  });

  if (!results.length) {
    bar.innerHTML = '<div style="padding:12px;color:var(--text3);font-size:13px;">No results found in this report.</div>';
  }
}

function switchTab(pid) {
  document.querySelectorAll('.ttab').forEach(t => t.classList.toggle('active', t.dataset.pid === pid));
  document.querySelectorAll('.tpanel').forEach(p => p.classList.toggle('active', p.id === pid));
}

function shortTarget(t) {
  return t.length > 52 ? '…' + t.slice(-49) : t;
}

// ── Panel HTML ────────────────────────────────────────────────
function buildPanel(res, pid) {
  return `
  <div class="card">
    <div class="toolbar" id="tb-${pid}">
      <input class="search" id="s-${pid}" placeholder="Search CVE, package, title…">
      <button class="fbtn" data-pid="${pid}" data-sev="CRITICAL">Critical</button>
      <button class="fbtn" data-pid="${pid}" data-sev="HIGH">High</button>
      <button class="fbtn" data-pid="${pid}" data-sev="MEDIUM">Medium</button>
      <button class="fbtn" data-pid="${pid}" data-sev="LOW">Low</button>
      <button class="fbtn" data-pid="${pid}" data-sev="UNKNOWN">Unknown</button>
      <span class="tcount" id="cnt-${pid}"></span>
    </div>
    <div style="overflow-x:auto">
      <table id="tbl-${pid}">
        <thead><tr>
          <th style="width:24px"></th>
          <th data-pid="${pid}" data-key="VulnerabilityID">CVE / ID</th>
          <th data-pid="${pid}" data-key="Severity">Severity</th>
          <th data-pid="${pid}" data-key="PkgName">Package</th>
          <th data-pid="${pid}" data-key="InstalledVersion">Installed</th>
          <th data-pid="${pid}" data-key="FixedVersion">Fixed in</th>
          <th>Score</th>
          <th data-pid="${pid}" data-key="Status">Status</th>
          <th>Title</th>
        </tr></thead>
        <tbody id="tbody-${pid}"></tbody>
      </table>
    </div>
  </div>`;
}

function wirePanel(res, pid) {
  document.getElementById('s-' + pid).addEventListener('input', () => renderTable(res, pid));

  document.querySelectorAll(`.fbtn[data-pid="${pid}"]`).forEach(btn => {
    btn.addEventListener('click', () => {
      const sev = btn.dataset.sev;
      const s = sevFilters[pid];
      if (s.has(sev)) { s.delete(sev); btn.classList.remove(`on-${sev.toLowerCase()}`); }
      else { s.add(sev); btn.classList.add(`on-${sev.toLowerCase()}`); }
      renderTable(res, pid);
    });
  });

  document.querySelectorAll(`#tbl-${pid} thead th[data-key]`).forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      const ss = sortState[pid];
      ss.dir = ss.key === key ? -ss.dir : 1;
      ss.key = key;
      renderTable(res, pid);
    });
  });

  renderTable(res, pid);
}

// ── Table render ──────────────────────────────────────────────
function renderTable(res, pid) {
  const vulns = res.Vulnerabilities || [];
  const q = document.getElementById('s-' + pid).value.toLowerCase();
  const sevF = sevFilters[pid];

  const SEV_ORDER = {CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,UNKNOWN:4};

  let rows = vulns.filter(v => {
    const matchQ = !q || [v.VulnerabilityID, v.PkgName, v.PkgID, v.Title, v.Description].join(' ').toLowerCase().includes(q);
    const matchS = sevF.size === 0 || sevF.has(v.Severity || 'UNKNOWN');
    return matchQ && matchS;
  });

  const { key, dir } = sortState[pid];
  rows.sort((a, b) => {
    if (key === 'Severity') {
      return ((SEV_ORDER[a.Severity] ?? 9) - (SEV_ORDER[b.Severity] ?? 9)) * dir;
    }
    const av = (a[key] || '').toLowerCase();
    const bv = (b[key] || '').toLowerCase();
    return (av < bv ? -1 : av > bv ? 1 : 0) * dir;
  });

  document.getElementById('cnt-' + pid).textContent = `${rows.length} / ${vulns.length} vulns`;

  const tbody = document.getElementById('tbody-' + pid);
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty">No vulnerabilities match your filter.</div></td></tr>`;
    updateSortHeaders(pid, key, dir);
    return;
  }

  tbody.innerHTML = rows.map((v, i) => {
    const rid = `${pid}-r${i}`;
    const sev = v.Severity || 'UNKNOWN';
    const score = getBestScore(v);
    const scoreColor = score >= 9 ? 'var(--c-crit)' : score >= 7 ? 'var(--c-high)' : score >= 4 ? 'var(--c-med)' : score > 0 ? 'var(--c-low)' : 'var(--text3)';
    const status = (v.Status || '').toLowerCase().replace(/ /g,'_');
    const fixed = v.FixedVersion || '<span style="color:var(--text3)">—</span>';

    return `
    <tr onclick="toggleX('${rid}',event)">
      <td><button class="xbtn" id="xb-${rid}">▸</button></td>
      <td class="mono" style="font-size:12px;font-weight:500;color:var(--accent)">${esc(v.VulnerabilityID||'—')}</td>
      <td><span class="sev sev-${sev}">${sev}</span></td>
      <td>
        <div class="pkg-wrap">
          <span class="pkg-name">${esc(v.PkgName||'—')}</span>
          ${v.PkgID && v.PkgID !== v.PkgName ? `<span class="pkg-ver">${esc(v.PkgID)}</span>` : ''}
        </div>
      </td>
      <td class="mono" style="font-size:12px">${esc(v.InstalledVersion||'—')}</td>
      <td class="mono" style="font-size:12px;color:var(--c-low)">${fixed}</td>
      <td>
        <div class="score-wrap">
          <span class="score-val" style="color:${scoreColor}">${score > 0 ? score.toFixed(1) : '—'}</span>
          ${score > 0 ? `<div class="score-bar"><div class="score-fill" style="width:${score*10}%;background:${scoreColor}"></div></div>` : ''}
        </div>
      </td>
      <td><span class="status-badge ${status}">${esc(v.Status||'—')}</span></td>
      <td style="font-size:12px;color:var(--text2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v.Title||'')}">${esc(v.Title||'—')}</td>
    </tr>
    <tr class="xrow" id="x-${rid}">
      <td class="xcell" colspan="9">
        <div class="xbody">${buildDetail(v)}</div>
      </td>
    </tr>`;
  }).join('');

  updateSortHeaders(pid, key, dir);
}

function buildDetail(v) {
  const cvss = v.CVSS || {};
  const cwes = v.CweIDs || [];
  const refs = v.References || [];
  const vs   = v.VendorSeverity || {};
  const purl = v.PkgIdentifier?.PURL || '';
  const uid  = v.PkgIdentifier?.UID || '';
  const pub  = v.PublishedDate ? fmtDate(v.PublishedDate) : '—';
  const mod  = v.LastModifiedDate ? fmtDate(v.LastModifiedDate) : '—';
  const src  = v.DataSource;
  const layer = v.Layer?.DiffID || '';

  const cvssRows = Object.entries(cvss).map(([src2, c]) => {
    const v3 = c.V3Score != null ? `V3 <b>${c.V3Score}</b>` : '';
    const v2 = c.V2Score != null ? `V2 <b>${c.V2Score}</b>` : '';
    const vec3 = c.V3Vector || '';
    const vec2 = c.V2Vector || '';
    return `
    <div class="cvss-row">
      <span class="cvss-src">${esc(src2)}</span>
      <span>${[v3,v2].filter(Boolean).join(' · ')}</span>
    </div>
    ${vec3 ? `<div class="cvss-vec">${esc(vec3)}</div>` : ''}
    ${vec2 ? `<div class="cvss-vec">${esc(vec2)}</div>` : ''}`;
  }).join('');

  return `<div class="xgrid">
    ${v.Description ? `<div class="xfield" style="grid-column:1/-1"><label>Description</label><p>${esc(v.Description)}</p></div>` : ''}
    ${purl ? `<div class="xfield" style="grid-column:1/-1"><label>PURL</label><p class="mono">${esc(purl)}</p></div>` : ''}
    <div class="xfield"><label>Published</label><p>${pub}</p></div>
    <div class="xfield"><label>Last modified</label><p>${mod}</p></div>
    ${v.SeveritySource ? `<div class="xfield"><label>Severity source</label><p>${esc(v.SeveritySource)}</p></div>` : ''}
    ${uid ? `<div class="xfield"><label>UID</label><p class="mono">${esc(uid)}</p></div>` : ''}
    ${layer ? `<div class="xfield" style="grid-column:1/-1"><label>Layer DiffID</label><p class="mono">${esc(layer)}</p></div>` : ''}
    ${cwes.length ? `<div class="xfield"><label>CWE(s)</label><p>${cwes.map(c=>`<span class="cwe">${esc(c)}</span>`).join('')}</p></div>` : ''}
    ${Object.keys(vs).length ? `<div class="xfield"><label>Vendor severity</label><div class="vendor-row">${Object.entries(vs).map(([k2,val])=>`<span class="vscore">${esc(k2)}: ${val}</span>`).join('')}</div></div>` : ''}
    ${cvssRows ? `<div class="xfield" style="grid-column:1/-1"><label>CVSS</label><div class="cvss-block">${cvssRows}</div></div>` : ''}
    ${src ? `<div class="xfield"><label>Data source</label><p>${esc(src.Name||src.ID||'—')}${src.URL ? ` · <a href="${src.URL}" target="_blank" style="color:var(--accent)">link</a>` : ''}</p></div>` : ''}
    ${v.PrimaryURL ? `<div class="xfield"><label>Primary URL</label><p><a href="${esc(v.PrimaryURL)}" target="_blank" style="color:var(--accent);font-size:12px;">${esc(v.PrimaryURL)}</a></p></div>` : ''}
    ${refs.length ? `<div class="xfield" style="grid-column:1/-1"><label>References (${refs.length})</label><div class="refs-list">${refs.slice(0,10).map(r=>`<a href="${esc(r)}" target="_blank">${esc(r)}</a>`).join('')}${refs.length>10?`<span style="color:var(--text3);font-size:11px">+${refs.length-10} more</span>`:''}</div></div>` : ''}
  </div>`;
}

// ── Helpers ───────────────────────────────────────────────────
function getAllVulns() {
  return (DATA.Results || []).flatMap(r => r.Vulnerabilities || []);
}

function countSev(vulns) {
  const c = {};
  vulns.forEach(v => { const s = v.Severity||'UNKNOWN'; c[s]=(c[s]||0)+1; });
  return c;
}

function getBestScore(v) {
  let best = 0;
  Object.values(v.CVSS || {}).forEach(c => {
    if ((c.V3Score || 0) > best) best = c.V3Score;
    if ((c.V2Score || 0) > best) best = c.V2Score;
  });
  return best;
}

function fmtDate(s) {
  try { return new Date(s).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); }
  catch { return s; }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleX(rid, e) {
  if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
  const row = document.getElementById('x-' + rid);
  const btn = document.getElementById('xb-' + rid);
  if (!row) return;
  const open = row.classList.toggle('open');
  if (btn) btn.textContent = open ? '▾' : '▸';
}

function updateSortHeaders(pid, key, dir) {
  const tbl = document.getElementById('tbl-' + pid);
  if (!tbl) return;
  tbl.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sa','sd');
    if (th.dataset.key === key) th.classList.add(dir === 1 ? 'sa' : 'sd');
  });
}
</script>
</body>
</html>
